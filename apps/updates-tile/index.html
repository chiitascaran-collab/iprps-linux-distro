<!-- Hub tile for IPRPS Updates: shows what the last check found. Installing happens in the IPRPS Updates window. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPRPS Updates</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0e1a; color: #e6e3d6; font: 16px/1.5 system-ui, "DejaVu Sans", sans-serif; }
  main { max-width: 560px; padding: 24px; }
  h1 { font: 600 28px "DejaVu Serif", Georgia, serif; color: #f1d58c; margin: 0 0 8px; display: flex; gap: 12px; align-items: center; }
  h1 img { width: 44px; height: 44px; }
  .card { background: #161c38; border: 1px solid #2a3360; border-radius: 12px; padding: 16px; margin: 14px 0; }
  .ok { color: #7fc98a; } .bad { color: #e07a6a; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; } td { padding: 4px 6px; border-bottom: 1px solid #2a3360; }
  .fine { color: #a9a79d; font-size: 14px; } code { background: #0008; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<main>
  <h1><img src="favicon.svg" alt="">IPRPS Updates</h1>
  <div class="card" id="state">Reading the last check…</div>
  <p>To install updates and optional software, open <b>IPRPS Updates</b> from the menu (<b>IPRPS → IPRPS Updates</b>). It asks for an administrator's password.</p>
  <p class="fine">In a terminal: <code>sudo iprps-update</code> (status), <code>sudo iprps-update upgrade</code> (install updates).</p>
</main>
<script>
(async () => {
  const box = document.getElementById('state');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  try {
    const s = await (await fetch('api.php', { cache: 'no-store' })).json();
    if (!s.known) { box.innerHTML = 'No update check yet. IPRPS OS looks for updates about 10 minutes after starting, when online.'; return; }
    const when = s.checked ? new Date(s.checked * 1000).toLocaleString() : 'never';
    let html = !s.check_ok ? `<b class="bad">The last check didn't work.</b> ${esc(s.error)}`
      : s.updates.length ? `<b>${s.updates.length} update${s.updates.length > 1 ? 's are' : ' is'} ready.</b>`
      : '<b class="ok">✓ IPRPS OS is up to date.</b>';
    if (s.updates.length) html += '<table>' + s.updates.map(u => `<tr><td>${esc(u.name)}</td><td>${esc(u.old)} → ${esc(u.new)}</td></tr>`).join('') + '</table>';
    if (s.restart) html += '<p><b>Restart the computer</b> to finish the last update.</p>';
    box.innerHTML = html + `<p class="fine">Last check: ${esc(when)}</p>`;
  } catch (e) { box.textContent = 'The update status is not available.'; }
})();
</script>
</body>
</html>
