<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dice Roller</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../iprps-lib/iprps.css">
<link rel="stylesheet" href="dice.css">
<script src="../auth/auth-client.js"></script>
<script src="../iprps-lib/iprps.js"></script>
<script src="../iprps-lib/dice.js"></script>
</head>
<body>
<header class="bar">
  <div class="brand"><span class="sigil">🎲</span> IPRPS <b>Dice</b></div>
  <div id="picker"></div>
  <div class="spacer"></div>
  <span id="who" class="who"></span>
</header>
<div id="banner" class="banner" hidden></div>

<div class="layout">
  <main class="tray">
    <section class="result" id="result" aria-live="polite">
      <div class="total" id="rTotal">—</div>
      <div class="rlabel" id="rLabel">Roll something</div>
      <div class="rdetail" id="rDetail">Click a die, type dice like <code>2d6+3</code>, or use an IPRPS roll.</div>
      <dl class="rlines" id="rLines"></dl>
    </section>

    <section class="card">
      <h2>Dice</h2>
      <div class="row dice" id="quick"></div>
      <div class="row">
        <label class="field">How many <input id="qCount" type="number" min="1" max="20" value="1"></label>
        <label class="field">Modifier <input id="qMod" type="number" value="0"></label>
        <input id="expr" class="grow" maxlength="60" placeholder="Any dice: 2d6+3, 4d6kh3 (keep highest 3), 1d6! (explodes), d%">
        <button id="exprBtn">Roll</button>
      </div>
    </section>

    <section class="card">
      <h2>IPRPS rolls</h2>
      <div class="row"><select id="preset" class="grow"></select><button id="presetBtn">Roll</button></div>
      <div class="row fields" id="fields"></div>
      <p class="fine" id="presetHelp"></p>
    </section>
  </main>

  <aside class="side">
    <section class="card">
      <h2>Who rolls</h2>
      <input id="who2" list="names" maxlength="60" placeholder="Session Master">
      <datalist id="names"></datalist>
      <h2 class="mt">After each roll</h2>
      <label class="check"><input type="checkbox" id="logIt"> Add it to the session log</label>
      <label class="check"><input type="checkbox" id="showDisp"> Show it on the player display</label>
      <label class="check"><input type="checkbox" id="showTable"> Show it on the IPRPS Table</label>
      <label class="check" title="Not logged and not shown, whatever is ticked above"><input type="checkbox" id="secret"> Secret roll (only you see it)</label>
    </section>
    <section class="card hist">
      <div class="row"><h2 class="grow">History</h2><button id="clearHist" class="ghost small">Clear</button></div>
      <ol id="history" class="history"></ol>
    </section>
  </aside>
</div>
<div id="toast" class="toast" hidden></div>
<script src="dice-app.js"></script>
</body>
</html>
