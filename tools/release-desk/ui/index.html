<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPRPS Release Desk</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="desk.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="icon.svg" alt=""><div><b>IPRPS Release Desk</b><small id="ver"></small></div></div>
  <nav role="tablist">
    <button role="tab" data-tab="tasks" class="on">Tasks</button>
    <button role="tab" data-tab="status">Status</button>
    <button role="tab" data-tab="folders">Folders</button>
  </nav>
  <div class="here" id="here" title="Where the Desk is running"></div>
</header>

<main>
  <section id="tab-tasks" class="tab on">
    <aside class="side">
      <button class="primary wide" id="newTask">＋ New task</button>
      <h3>Your tasks</h3>
      <ul id="jobList" class="joblist"></ul>
      <p class="hint" id="noJobs">No tasks yet. Start one with <b>New task</b>.</p>
    </aside>
    <div class="work" id="work"></div>
  </section>

  <section id="tab-status" class="tab"><div id="status" class="pad"></div></section>
  <section id="tab-folders" class="tab"><div id="folders" class="pad"></div></section>
</main>

<div class="modal" id="browser" hidden>
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="brTitle">
    <h3 id="brTitle">Choose a folder or .zip</h3>
    <div class="places" id="brPlaces"></div>
    <div class="brpath"><button id="brUp" title="Up one folder">↑</button><code id="brPath"></code></div>
    <ul id="brList" class="brlist"></ul>
    <div class="row end"><button id="brCancel">Cancel</button><button class="primary" id="brPick">Use this folder</button></div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
