# /etc/pacman.conf - IPRPS OS package manager settings (guide 12.12)
# Owned by the iprps-base package. If you change this file, an update installs
# its new version as /etc/pacman.conf.pacnew instead of replacing yours.
# Use "sudo iprps-update" or the IPRPS Updates app rather than pacman directly:
# they always update the whole system and adopt files the release installed.

[options]
HoldPkg      = pacman iprps-base iprps-keyring
Architecture = x86_64
CheckSpace
Color
ParallelDownloads = 3
# Every IPRPS package and repository database must carry a valid IPRPS signature.
SigLevel          = Required
LocalFileSigLevel = Optional
# Settings made on this computer are never replaced by a package.
NoUpgrade    = etc/iprps/db.php

# The IPRPS repositories (infiniteplane.space). One release series per folder ("1" = IPRPS OS 1.x).
[iprps-core]
Include = /etc/pacman.d/iprps-mirrorlist

[iprps-apps]
Include = /etc/pacman.d/iprps-mirrorlist

[iprps-extra]
Include = /etc/pacman.d/iprps-mirrorlist
