<!-- Upload to the shared /auth/ folder (beside auth-client.js). IPRPS Link on a Session Master's computer sends the
     user here to sign in; this page hands the signed-in session back to that computer, and only to that computer. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Connect IPRPS Link</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0e1a; color: #e6e3d6; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 480px; padding: 24px; text-align: center; }
  h1 { font: 600 26px Georgia, serif; color: #f1d58c; }
  p { color: #b9b6a8; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 11px 22px; cursor: pointer; margin: 6px; }
  #allow { background: #d9b45a; color: #1a1405; } #deny { background: transparent; color: #d9b45a; border: 1px solid #5b5330; }
</style>
<script src="auth-client.js"></script>
</head>
<body>
<main>
  <h1>✦ Connect IPRPS Link</h1>
  <p id="msg">Checking your sign-in…</p>
  <div id="buttons" hidden><button id="allow">Allow</button><button id="deny">Cancel</button></div>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search), back = q.get('return') || '', state = q.get('state') || '';
  var msg = document.getElementById('msg');
  // Only ever hand a session to a page on the user's own computer.
  var ok = /^http:\/\/(localhost|127\.0\.0\.1):\d{2,5}\/auth\/callback$/.test(back) && /^[a-f0-9]{16,64}$/.test(state);
  function ready(user) {
    if (!ok) { msg.textContent = 'This link did not come from IPRPS Link. Open IPRPS Link on your IPRPS OS computer and choose “Sign in with Infinite Plane”.'; return; }
    msg.textContent = 'IPRPS Link on this computer wants to use your Infinite Plane account (' + (user.username || user.email) + ') to connect your IPRPS Table to your relay. Only allow this on your own computer.';
    document.getElementById('buttons').hidden = false;
    document.getElementById('allow').onclick = function () { location.replace(back + '#token=' + encodeURIComponent(window.IPAuth.token()) + '&state=' + encodeURIComponent(state)); };
    document.getElementById('deny').onclick = function () { location.replace(back + '#cancelled=1'); };
  }
  if (window.IPAuth && window.IPAuth.user) ready(window.IPAuth.user);
  else document.addEventListener('ipauth:ready', function (e) { ready(e.detail); });
})();
</script>
</body>
</html>
