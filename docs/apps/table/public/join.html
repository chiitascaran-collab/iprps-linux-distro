<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e1a">
<title>Join the table · IPRPS</title>
<link rel="icon" href="/assets/table-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/table.css">
</head>
<body data-role="join" class="joinpage">
<main class="joinbox">
  <div class="sigilbig">✦</div>
  <h1>IPRPS <b>Table</b></h1>
  <p id="state" class="state">Looking for the table…</p>
  <form id="join" hidden>
    <label><span>Join code</span><input id="code" name="code" required maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="From the Session Master"></label>
    <label><span>Your name</span><input id="name" name="name" required maxlength="32" autocomplete="nickname" placeholder="Alex"></label>
    <label><span>Character <small>(optional)</small></span><input id="character" name="character" maxlength="48" placeholder="Brenna of the Wolffolk"></label>
    <button class="gold big" type="submit">Join the table</button>
    <p id="err" class="err" role="alert"></p>
  </form>
  <p class="fine">Infinite Plane Role Playing System · Mythical Legends Publishing</p>
</main>
<script src="/assets/common.js"></script>
<script src="/assets/join.js"></script>
</body>
</html>
